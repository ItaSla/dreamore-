<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bsky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="60%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="pixgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="url(#bsky)"/>
  <rect width="960" height="540" fill="url(#pixgrid)"/>
  <!-- Pixel Clouds -->
  <g fill="rgba(255,255,255,0.16)">
    <rect x="110" y="88" width="96" height="24"/>
    <rect x="134" y="68" width="48" height="20"/>
    <rect x="640" y="106" width="120" height="26"/>
    <rect x="670" y="84" width="60" height="22"/>
  </g>
  <!-- Retro Street Horizon -->
  <rect x="0" y="340" width="960" height="200" fill="#1e293b"/>
  <rect x="0" y="340" width="960" height="12" fill="#22c55e"/>
  <rect x="60" y="180" width="160" height="160" fill="#0f172a" stroke="#10b981" stroke-width="3"/>
  <rect x="86" y="206" width="44" height="38" fill="#fde047"/>
  <rect x="150" y="206" width="44" height="38" fill="#34d399"/>
  <rect x="86" y="264" width="108" height="76" fill="#334155"/>
  <!-- Cola Arcade Sign -->
  <rect x="590" y="160" width="290" height="180" fill="#0f172a" stroke="#f59e0b" stroke-width="3"/>
  <rect x="620" y="190" width="230" height="54" rx="6" fill="#be123c"/>
  <text x="644" y="224" fill="#fef08a" font-family="monospace" font-size="22" font-weight="bold">BACON COLA 16-BIT</text>
  <!-- Pixel Hero & Action Effect -->
  <g transform="translate(360, 224)">
    <rect x="28" y="0" width="52" height="44" fill="#fde68a"/>
    <rect x="24" y="-12" width="60" height="18" fill="#78350f"/>
    <rect x="44" y="16" width="10" height="10" fill="#0f172a"/>
    <rect x="66" y="16" width="10" height="10" fill="#0f172a"/>
    <rect x="18" y="44" width="72" height="72" fill="#16a34a"/>
    <rect x="90" y="54" width="38" height="18" fill="#fde68a"/>
    <rect x="26" y="116" width="22" height="38" fill="#334155"/>
    <rect x="60" y="116" width="22" height="38" fill="#334155"/>
  </g>
  <!-- Dashed Road Stripes -->
  <rect x="40" y="438" width="110" height="14" fill="#e2e8f0" opacity="0.5"/>
  <rect x="230" y="438" width="110" height="14" fill="#e2e8f0" opacity="0.5"/>
  <rect x="420" y="438" width="110" height="14" fill="#e2e8f0" opacity="0.5"/>
  <rect x="610" y="438" width="110" height="14" fill="#e2e8f0" opacity="0.5"/>
  <rect x="800" y="438" width="110" height="14" fill="#e2e8f0" opacity="0.5"/>
</svg>
