      <stop offset="0%" stop-color="#140c08"/>
      <stop offset="55%" stop-color="#3f1d0b"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>
    <radialGradient id="corona" cx="50%" cy="34%" r="28%">
      <stop offset="0%" stop-color="#fb923c" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3f1d0b" stop-opacity="0"/>
