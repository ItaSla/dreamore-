  <rect x="144" y="179" width="302" height="187" rx="6" fill="url(#screen1)"/>
  <rect x="144" y="179" width="302" height="22" fill="#312e81"/>
  <circle cx="158" cy="190" r="4" fill="#f43f5e"/>
  <circle cx="172" cy="190" r="4" fill="#f59e0b"/>
  <circle cx="186" cy="190" r="4" fill="#10b981"/>
