<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <pattern id="px" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(165,180,252,0.1)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="url(#wbg)"/>
  <rect width="960" height="540" fill="url(#px)"/>
  <!-- Pixel Art Canvas Frame -->
  <rect x="110" y="72" width="540" height="396" rx="16" fill="#0f172a" stroke="#6366f1" stroke-width="3"/>
